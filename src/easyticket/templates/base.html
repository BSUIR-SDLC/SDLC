<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EasyTicket{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a1a; }
    header { padding: 12px 16px; background: #0b4fd6; color: #fff; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    main { max-width: 960px; margin: 0 auto; padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .card { border: 1px solid #ccd; border-radius: 8px; padding: 12px; }
    .tag { display: inline-block; font-size: 12px; background: #e8efff; border-radius: 4px; padding: 2px 6px; }
    form.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 16px; }
    label { display: flex; flex-direction: column; font-size: 14px; }
    .btn { background: #0b4fd6; color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; text-decoration: none; cursor: pointer; }
    nav.pages a, nav.pages span { margin-right: 8px; }
  </style>
</head>
<body>
  <header><a href="/">EasyTicket</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
