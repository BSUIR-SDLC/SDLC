<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="dshadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="crosshair" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <circle cx="5" cy="5" r="3" fill="none" stroke="#475569" stroke-width="1.5"/>
      <line x1="1" y1="5" x2="9" y2="5" stroke="#475569" stroke-width="1.5"/>
      <line x1="5" y1="1" x2="5" y2="9" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Diagram Title Header -->
  <rect x="15" y="15" width="970" height="40" fill="#1e293b" rx="6"/>
  <text x="30" y="40" fill="#ffffff" font-size="14" font-weight="bold">SysML v2 Requirement Diagram: WineVaultSystem [Каталог домашних вин с напоминанием о выдержке]</text>

  <!-- Root Requirement Box -->
  <g filter="url(#dshadow)">
    <rect x="330" y="75" width="340" height="85" rx="6" fill="#ffffff" stroke="#8b2252" stroke-width="2"/>
    <rect x="330" y="75" width="340" height="28" rx="6 6 0 0" fill="#8b2252"/>
    <text x="500" y="94" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">«requirement» WineVaultSystem</text>
    <text x="345" y="120" fill="#475569" font-size="11"><tspan font-weight="bold">Id:</tspan> REQ-SYS-001</text>
    <text x="345" y="140" fill="#0f172a" font-size="11">Система каталогизации вин, контроля выдержки и подбора пары</text>
  </g>

  <!-- Trunk Connector Line -->
  <line x1="500" y1="160" x2="500" y2="200" stroke="#64748b" stroke-width="2"/>
  <line x1="120" y1="200" x2="870" y2="200" stroke="#64748b" stroke-width="2"/>

  <!-- Branch Lines -->
  <line x1="120" y1="200" x2="120" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="200" x2="370" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="200" x2="630" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870" y1="200" x2="870" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sub-block 1: Wine Catalog -->
  <g filter="url(#dshadow)">
    <rect x="20" y="230" width="210" height="95" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="20" y="230" width="210" height="25" rx="6 6 0 0" fill="#0284c7"/>
    <text x="125" y="247" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">«requirement» WineCatalog</text>
    <text x="30" y="270" fill="#475569" font-size="10"><tspan font-weight="bold">Id:</tspan> REQ-FUNC-001</text>
    <text x="30" y="288" fill="#0f172a" font-size="10">Учет коллекции, сортов вин,</text>
    <text x="30" y="304" fill="#0f172a" font-size="10">винтажей и параметров тары</text>
  </g>

  <!-- Sub-block 2: Aging Tracker -->
  <g filter="url(#dshadow)">
    <rect x="265" y="230" width="220" height="95" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="265" y="230" width="220" height="25" rx="6 6 0 0" fill="#16a34a"/>
    <text x="375" y="247" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">«requirement» AgingLifecycle</text>
    <text x="275" y="270" fill="#475569" font-size="10"><tspan font-weight="bold">Id:</tspan> REQ-FUNC-003</text>
    <text x="275" y="288" fill="#0f172a" font-size="10">Предиктивный расчет окна</text>
    <text x="275" y="304" fill="#0f172a" font-size="10">зрелости и пика выдержки</text>
  </g>

  <!-- Sub-block 3: Sommelier -->
  <g filter="url(#dshadow)">
    <rect x="520" y="230" width="220" height="95" rx="6" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
    <rect x="520" y="230" width="220" height="25" rx="6 6 0 0" fill="#9333ea"/>
    <text x="630" y="247" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">«requirement» VirtualSommelier</text>
    <text x="530" y="270" fill="#475569" font-size="10"><tspan font-weight="bold">Id:</tspan> REQ-FUNC-006</text>
    <text x="530" y="288" fill="#0f172a" font-size="10">Гастрономический пейринг под</text>
    <text x="530" y="304" fill="#0f172a" font-size="10">блюдо/событие из запасов</text>
  </g>

  <!-- Sub-block 4: Non-Functional / Reliability -->
  <g filter="url(#dshadow)">
    <rect x="765" y="230" width="215" height="95" rx="6" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="765" y="230" width="215" height="25" rx="6 6 0 0" fill="#e11d48"/>
    <text x="872" y="247" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">«requirement» PersistenceAirgap</text>
    <text x="775" y="270" fill="#475569" font-size="10"><tspan font-weight="bold">Id:</tspan> REQ-NFR-REL-001</text>
    <text x="775" y="288" fill="#0f172a" font-size="10">Атомарный JSON (Offline-first),</text>
    <text x="775" y="304" fill="#0f172a" font-size="10">полная изоляция данных</text>
  </g>

  <!-- Secondary Row Connectors -->
  <!-- Under WineCatalog -->
  <line x1="120" y1="325" x2="120" y2="360" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g filter="url(#dshadow)">
    <rect x="20" y="360" width="210" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="382" fill="#0284c7" font-size="11" font-weight="bold">REQ-FUNC-002: Topology</text>
    <text x="30" y="402" fill="#334155" font-size="10">Учет адреса в погребе</text>
    <text x="30" y="418" fill="#334155" font-size="10">(ряд, стеллаж, полка, ячейка)</text>
  </g>

  <line x1="120" y1="445" x2="120" y2="475" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g filter="url(#dshadow)">
    <rect x="20" y="475" width="210" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="497" fill="#0284c7" font-size="11" font-weight="bold">REQ-FUNC-008: CsvExport</text>
    <text x="30" y="517" fill="#334155" font-size="10">Экспорт реестра и статусов</text>
    <text x="30" y="533" fill="#334155" font-size="10">в табличный формат CSV/Excel</text>
  </g>

  <!-- Under AgingLifecycle -->
  <line x1="375" y1="325" x2="375" y2="360" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g filter="url(#dshadow)">
    <rect x="265" y="360" width="220" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="275" y="382" fill="#16a34a" font-size="11" font-weight="bold">REQ-FUNC-004: CalendarUI</text>
    <text x="275" y="402" fill="#334155" font-size="10">Визуальный календарь с</text>
    <text x="275" y="418" fill="#334155" font-size="10">цветовой шкалой зрелости</text>
  </g>

  <line x1="375" y1="445" x2="375" y2="475" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g filter="url(#dshadow)">
    <rect x="265" y="475" width="220" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="275" y="497" fill="#16a34a" font-size="11" font-weight="bold">REQ-FUNC-005: ReadyFilter</text>
    <text x="275" y="517" fill="#334155" font-size="10">Мгновенный фильтр вин</text>
    <text x="275" y="533" fill="#334155" font-size="10">'Готово к открытию сейчас'</text>
  </g>

  <!-- Under VirtualSommelier -->
  <line x1="630" y1="325" x2="630" y2="360" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g filter="url(#dshadow)">
    <rect x="520" y="360" width="220" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="530" y="382" fill="#9333ea" font-size="11" font-weight="bold">REQ-FUNC-007: TastingJournal</text>
    <text x="530" y="402" fill="#334155" font-size="10">История дегустаций, баллы</text>
    <text x="530" y="418" fill="#334155" font-size="10">и персональные органолепт. ноты</text>
  </g>

  <!-- Under Non-Functional -->
  <line x1="872" y1="325" x2="872" y2="360" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g filter="url(#dshadow)">
    <rect x="765" y="360" width="215" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="775" y="382" fill="#e11d48" font-size="11" font-weight="bold">REQ-NFR-PERF-001: Speed</text>
    <text x="775" y="402" fill="#334155" font-size="10">Холодный старт &lt; 1.5 с,</text>
    <text x="775" y="418" fill="#334155" font-size="10">время отклика UI &lt; 100 мс</text>
  </g>

  <!-- Bottom Legend -->
  <rect x="20" y="600" width="960" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="35" y="625" fill="#1e293b" font-size="12" font-weight="bold">Легенда и трассируемость нотации SysML v2:</text>
  <text x="35" y="648" fill="#475569" font-size="11">• Связи декомпозиции требований («subrequirement») идут от корневого блока требований верхнего уровня к частным функциям.</text>
  <text x="35" y="666" fill="#475569" font-size="11">• Все требования взаимно верифицируемы, протестированы в рамках ролевой игры с Заказчиком и зафиксированы в SRS v1.1.</text>
</svg>