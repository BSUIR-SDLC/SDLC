<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="dshadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Diagram Title Header -->
  <rect x="15" y="15" width="970" height="38" fill="#1e293b" rx="6"/>
  <text x="30" y="39" fill="#ffffff" font-size="13" font-weight="bold">SysML v2 Requirement Diagram: WineVaultSystem [Каталог домашних вин с напоминанием о выдержке]</text>

  <!-- Root Requirement Box -->
  <g filter="url(#dshadow)">
    <rect x="290" y="75" width="420" height="85" rx="6" fill="#ffffff" stroke="#8b2252" stroke-width="2"/>
    <rect x="290" y="75" width="420" height="26" rx="6 6 0 0" fill="#8b2252"/>
    <text x="500" y="93" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">«requirement» WineVaultSystem</text>
    <text x="305" y="118" fill="#475569" font-size="11"><tspan font-weight="bold">Id:</tspan> REQ-SYS-001</text>
    <text x="305" y="136" fill="#0f172a" font-size="11">Каталогизация вин, контроль выдержки и подбор винных пар</text>
    <text x="305" y="152" fill="#64748b" font-size="10">Декомпозиция на 4 подсистемы верхнего уровня</text>
  </g>

  <!-- Trunk Connector Line -->
  <line x1="500" y1="160" x2="500" y2="195" stroke="#64748b" stroke-width="2"/>
  <line x1="120" y1="195" x2="875" y2="195" stroke="#64748b" stroke-width="2"/>

  <!-- Branch Lines -->
  <line x1="120" y1="195" x2="120" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="195" x2="370" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="195" x2="630" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="875" y1="195" x2="875" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sub-block 1: Wine Catalog -->
  <g filter="url(#dshadow)">
    <rect x="20" y="225" width="205" height="95" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="20" y="225" width="205" height="24" rx="6 6 0 0" fill="#0284c7"/>
    <text x="122" y="241" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">«requirement» WineCatalog</text>
    <text x="30" y="264" fill="#475569" font-size="10"><tspan font-weight="bold">Id:</tspan> REQ-FUNC-001</text>
    <text x="30" y="282" fill="#0f172a" font-size="10">Учет коллекции, сортов вин,</text>
    <text x="30" y="298" fill="#0f172a" font-size="10">винтажей и объема тары</text>
  </g>

  <!-- Sub-block 2: Aging Tracker -->
  <g filter="url(#dshadow)">
    <rect x="265" y="225" width="215" height="95" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="265" y="225" width="215" height="24" rx="6 6 0 0" fill="#16a34a"/>
    <text x="372" y="241" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">«requirement» AgingLifecycle</text>
    <text x="275" y="264" fill="#475569" font-size="10"><tspan font-weight="bold">Id:</tspan> REQ-FUNC-003</text>
    <text x="275" y="282" fill="#0f172a" font-size="10">Предиктивный расчет окна</text>
    <text x="275" y="298" fill="#0f172a" font-size="10">зрелости и пика выдержки</text>
  </g>

  <!-- Sub-block 3: Sommelier -->
  <g filter="url(#dshadow)">
    <rect x="520" y="225" width="215" height="95" rx="6" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
    <rect x="520" y="225" width="215" height="24" rx="6 6 0 0" fill="#9333ea"/>
    <text x="627" y="241" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">«req» VirtualSommelier</text>
    <text x="530" y="264" fill="#475569" font-size="10"><tspan font-weight="bold">Id:</tspan> REQ-FUNC-006</text>
    <text x="530" y="282" fill="#0f172a" font-size="10">Гастрономический пейринг под</text>
    <text x="530" y="298" fill="#0f172a" font-size="10">блюда из складских запасов</text>
  </g>

  <!-- Sub-block 4: Non-Functional -->
  <g filter="url(#dshadow)">
    <rect x="765" y="225" width="215" height="95" rx="6" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="765" y="225" width="215" height="24" rx="6 6 0 0" fill="#e11d48"/>
    <text x="872" y="241" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">«req» PersistenceAirgap</text>
    <text x="775" y="264" fill="#475569" font-size="10"><tspan font-weight="bold">Id:</tspan> REQ-NFR-REL-001</text>
    <text x="775" y="282" fill="#0f172a" font-size="10">Атомарный JSON (Offline-first),</text>
    <text x="775" y="298" fill="#0f172a" font-size="10">полная изоляция данных</text>
  </g>

  <!-- Secondary Row Connectors -->
  <!-- Under WineCatalog -->
  <line x1="120" y1="320" x2="120" y2="355" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g filter="url(#dshadow)">
    <rect x="20" y="355" width="205" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="377" fill="#0284c7" font-size="11" font-weight="bold">REQ-FUNC-002: Topology</text>
    <text x="30" y="397" fill="#334155" font-size="10">Учет адреса в погребе</text>
    <text x="30" y="413" fill="#334155" font-size="10">(ряд, стеллаж, полка, ячейка)</text>
  </g>

  <line x1="120" y1="440" x2="120" y2="470" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g filter="url(#dshadow)">
    <rect x="20" y="470" width="205" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="492" fill="#0284c7" font-size="11" font-weight="bold">REQ-FUNC-009: CsvExport</text>
    <text x="30" y="512" fill="#334155" font-size="10">Экспорт реестра и статусов</text>
    <text x="30" y="528" fill="#334155" font-size="10">в табличный формат CSV/Excel</text>
  </g>

  <!-- Under AgingLifecycle -->
  <line x1="372" y1="320" x2="372" y2="355" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g filter="url(#dshadow)">
    <rect x="265" y="355" width="215" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="275" y="377" fill="#16a34a" font-size="11" font-weight="bold">REQ-FUNC-004: CalendarUI</text>
    <text x="275" y="397" fill="#334155" font-size="10">Визуальный календарь с</text>
    <text x="275" y="413" fill="#334155" font-size="10">цветовой шкалой зрелости</text>
  </g>

  <line x1="372" y1="440" x2="372" y2="470" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g filter="url(#dshadow)">
    <rect x="265" y="470" width="215" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="275" y="492" fill="#16a34a" font-size="11" font-weight="bold">REQ-FUNC-005: ReadyFilter</text>
    <text x="275" y="512" fill="#334155" font-size="10">Мгновенный фильтр вин</text>
    <text x="275" y="528" fill="#334155" font-size="10">'Готово к открытию сейчас'</text>
  </g>

  <!-- Under VirtualSommelier -->
  <line x1="627" y1="320" x2="627" y2="355" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g filter="url(#dshadow)">
    <rect x="520" y="355" width="215" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="530" y="377" fill="#9333ea" font-size="11" font-weight="bold">REQ-FUNC-007: TastingNotes</text>
    <text x="530" y="397" fill="#334155" font-size="10">История дегустаций, баллы</text>
    <text x="530" y="413" fill="#334155" font-size="10">и органолептические заметки</text>
  </g>

  <!-- Under Non-Functional -->
  <line x1="872" y1="320" x2="872" y2="355" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g filter="url(#dshadow)">
    <rect x="765" y="355" width="215" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="775" y="377" fill="#e11d48" font-size="11" font-weight="bold">REQ-NFR-PERF-001: Speed</text>
    <text x="775" y="397" fill="#334155" font-size="10">Холодный старт &lt; 1.5 с,</text>
    <text x="775" y="413" fill="#334155" font-size="10">время отклика UI &lt; 100 мс</text>
  </g>

  <!-- Bottom Legend -->
  <rect x="20" y="595" width="960" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="35" y="620" fill="#1e293b" font-size="12" font-weight="bold">Легенда и трассируемость нотации SysML v2:</text>
  <text x="35" y="642" fill="#475569" font-size="11">• Связи декомпозиции («subrequirement») связывают корневой блок требований с подсистемами и функциями.</text>
  <text x="35" y="660" fill="#475569" font-size="11">• Все требования взаимно верифицируемы, согласованы в ролевой игре с Заказчиком и зафиксированы в SRS v1.1.</text>
</svg>