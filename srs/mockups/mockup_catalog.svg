  <text x="505" y="432" fill="#64748b" font-size="11" font-weight="bold">ГАСТРОНОМИЧЕСКИЙ ПРОФИЛЬ И ЗАМЕТКИ СОМЕЛЬЕ</text>
  <text x="505" y="455" fill="#334155" font-size="12">• Аромат: Спелая вишня, малина, легкий оттенок подлеска и ванили.</text>
  <text x="505" y="475" fill="#334155" font-size="12">• Вкус: Шелковистые танины, сбалансированная кислотность, мягкое послевкусие.</text>
  <text x="505" y="495" fill="#334155" font-size="12">• Идеальные пары: Утка с ягодным соусом, тушеный кролик, зрелые сыры Бри/Камамбер.</text>

