<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="10" y="10" width="980" height="620" rx="8" fill="#f8f9fa" stroke="#dcdcdc" stroke-width="1" filter="url(#shadow3)"/>

  <!-- Window Titlebar -->
  <path d="M 10 10 L 990 10 A 8 8 0 0 1 990 46 L 10 46 A 0 0 0 0 1 10 10 Z" fill="#2b121d"/>
  <circle cx="32" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="28" r="6" fill="#27c93f"/>
  <text x="500" y="32" fill="#f5e6ec" font-size="13" font-weight="600" text-anchor="middle">WineVault v1.0 [Java / JavaFX] — Интеллектуальный ассистент «Виртуальный сомелье»</text>

  <!-- Navigation Bar -->
  <rect x="10" y="46" width="980" height="42" fill="#3d1425"/>
  <rect x="25" y="52" width="130" height="30" rx="5" fill="transparent"/>
  <text x="90" y="72" fill="#e0b0c5" font-size="13" text-anchor="middle">Каталог вин</text>
  <rect x="165" y="52" width="160" height="30" rx="5" fill="transparent"/>
  <text x="245" y="72" fill="#e0b0c5" font-size="13" text-anchor="middle">Календарь выдержки</text>
  <rect x="335" y="52" width="180" height="30" rx="5" fill="#8b2252"/>
  <text x="425" y="72" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Виртуальный сомелье</text>
  <rect x="525" y="52" width="140" height="30" rx="5" fill="transparent"/>
  <text x="595" y="72" fill="#e0b0c5" font-size="13" text-anchor="middle">Экспорт данных</text>

  <!-- Left Column: Parameters -->
  <rect x="25" y="100" width="375" height="490" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="25" y="100" width="375" height="40" rx="6 6 0 0" fill="#fdf2f8"/>
  <text x="45" y="126" fill="#831843" font-size="14" font-weight="bold">Параметры трапезы / события</text>

  <!-- Fields -->
  <text x="45" y="165" fill="#334155" font-size="12" font-weight="bold">Категория блюда:</text>
  <rect x="45" y="175" width="335" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="58" y="196" fill="#0f172a" font-size="12">Красное мясо, стейки, дичь</text>

  <text x="45" y="230" fill="#334155" font-size="12" font-weight="bold">Способ приготовления:</text>
  <rect x="45" y="240" width="335" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="58" y="261" fill="#0f172a" font-size="12">Гриль / средняя прожарка (Medium)</text>

  <text x="45" y="295" fill="#334155" font-size="12" font-weight="bold">Формат события:</text>
  <rect x="45" y="305" width="335" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="58" y="326" fill="#0f172a" font-size="12">Торжественный семейный ужин</text>

  <text x="45" y="365" fill="#334155" font-size="12" font-weight="bold">Критерии фильтрации коллекции:</text>
  
  <rect x="45" y="380" width="16" height="16" rx="3" fill="#8b2252"/>
  <text x="49" y="393" fill="#ffffff" font-size="11" font-weight="bold">✓</text>
  <text x="70" y="393" fill="#1e293b" font-size="12">Только зрелые вина (на пике вкуса)</text>

  <rect x="45" y="408" width="16" height="16" rx="3" fill="#8b2252"/>
  <text x="49" y="421" fill="#ffffff" font-size="11" font-weight="bold">✓</text>
  <text x="70" y="421" fill="#1e293b" font-size="12">Исключить бутылки в стадии созревания</text>

  <rect x="45" y="436" width="16" height="16" rx="3" fill="#8b2252"/>
  <text x="49" y="449" fill="#ffffff" font-size="11" font-weight="bold">✓</text>
  <text x="70" y="449" fill="#1e293b" font-size="12">Только экземпляры в наличии (>0)</text>

  <!-- Submit Button -->
  <rect x="45" y="525" width="335" height="42" rx="6" fill="#8b2252"/>
  <text x="212" y="551" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Подобрать винную пару</text>

  <!-- Right Column: Recommendations -->
  <rect x="420" y="100" width="555" height="490" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="420" y="100" width="555" height="40" rx="6 6 0 0" fill="#f8fafc"/>
  <text x="440" y="126" fill="#1e293b" font-size="14" font-weight="bold">Рекомендации сомелье из погреба (Найдено 2 пары)</text>

  <!-- Match 1: 98% -->
  <rect x="438" y="155" width="520" height="180" rx="6" fill="#fdf2f8" stroke="#f472b6" stroke-width="1"/>
  
  <rect x="455" y="170" width="130" height="22" rx="11" fill="#8b2252"/>
  <text x="520" y="185" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">СОВПАДЕНИЕ 98%</text>

  <text x="455" y="215" fill="#831843" font-size="15" font-weight="bold">Каберне Совиньон Резерв (2018)</text>
  <text x="455" y="233" fill="#475569" font-size="12">Локация: Стеллаж 1 • Полка 2 (яч. A-2-04) | В наличии: 2 бут.</text>
  
  <rect x="455" y="244" width="485" height="48" rx="4" fill="#ffffff" stroke="#fbcfe8" stroke-width="1"/>
  <text x="465" y="262" fill="#831843" font-size="10" font-weight="bold">ГАСТРОНОМИЧЕСКАЯ СОВМЕСТИМОСТЬ:</text>
  <text x="465" y="280" fill="#334155" font-size="11">Танины 6-летней выдержки связывают жиры говядины, раскрывая ноты смородины.</text>

  <rect x="455" y="299" width="180" height="26" rx="4" fill="#16a34a"/>
  <text x="545" y="316" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Зарезервировать к ужину</text>

  <!-- Match 2: 91% -->
  <rect x="438" y="350" width="520" height="175" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  
  <rect x="455" y="365" width="130" height="22" rx="11" fill="#475569"/>
  <text x="520" y="380" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">СОВПАДЕНИЕ 91%</text>

  <text x="455" y="410" fill="#1e293b" font-size="15" font-weight="bold">Саперави Кахетинское (2020)</text>
  <text x="455" y="428" fill="#475569" font-size="12">Локация: Стеллаж 2 • Полка 1 (яч. B-1-03) | В наличии: 3 бут.</text>
  
  <rect x="455" y="439" width="485" height="42" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="465" y="456" fill="#475569" font-size="10" font-weight="bold">АЛЬТЕРНАТИВНАЯ ПАРА:</text>
  <text x="465" y="471" fill="#334155" font-size="11">Плотный танинный профиль и выразительная кислотность балансируют стейк.</text>

  <rect x="455" y="489" width="160" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="535" y="506" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">Подробнее о вине</text>

  <!-- Bottom Window Statusbar -->
  <rect x="10" y="602" width="980" height="28" rx="0 0 8 8" fill="#e2e8f0"/>
  <text x="25" y="621" fill="#475569" font-size="11">Пейринг-движок: матрица соответствий (кислотность, танины, сладость vs соленость, жир, белок).</text>
</svg>