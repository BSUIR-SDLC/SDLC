<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="10" y="10" width="980" height="620" rx="10" fill="#f8f9fa" stroke="#dcdcdc" stroke-width="1" filter="url(#shadow3)"/>

  <!-- Window Titlebar -->
  <path d="M 10 10 L 990 10 A 10 10 0 0 1 990 48 L 10 48 A 0 0 0 0 1 10 10 Z" fill="#2b121d"/>
  <circle cx="32" cy="29" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="29" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="29" r="6" fill="#27c93f"/>
  <text x="500" y="33" fill="#f5e6ec" font-size="13" font-weight="600" text-anchor="middle">WineVault v1.0 [Java / JavaFX] — Интеллектуальный ассистент «Виртуальный сомелье»</text>

  <!-- Navigation Bar -->
  <rect x="10" y="48" width="980" height="44" fill="#3d1425"/>
  <rect x="25" y="55" width="130" height="30" rx="5" fill="transparent"/>
  <text x="90" y="75" fill="#e0b0c5" font-size="13" text-anchor="middle">Каталог вин</text>
  <rect x="165" y="55" width="160" height="30" rx="5" fill="transparent"/>
  <text x="245" y="75" fill="#e0b0c5" font-size="13" text-anchor="middle">Календарь выдержки</text>
  <rect x="335" y="55" width="180" height="30" rx="5" fill="#8b2252"/>
  <text x="425" y="75" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Виртуальный сомелье</text>
  <rect x="525" y="55" width="140" height="30" rx="5" fill="transparent"/>
  <text x="595" y="75" fill="#e0b0c5" font-size="13" text-anchor="middle">Экспорт данных</text>

  <!-- Left Column: Sommelier Query Parameters -->
  <rect x="25" y="105" width="380" height="485" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="25" y="105" width="380" height="45" rx="6 6 0 0" fill="#fdf2f8"/>
  <text x="45" y="133" fill="#831843" font-size="15" font-weight="bold">Параметры трапезы / события</text>

  <!-- Form Fields -->
  <text x="45" y="175" fill="#334155" font-size="12" font-weight="bold">Категория основного блюда:</text>
  <rect x="45" y="185" width="340" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="58" y="208" fill="#0f172a" font-size="13">Красное мясо, стейки, дичь</text>

  <text x="45" y="245" fill="#334155" font-size="12" font-weight="bold">Способ приготовления:</text>
  <rect x="45" y="255" width="340" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="58" y="278" fill="#0f172a" font-size="13">Гриль / средняя прожарка (Medium)</text>

  <text x="45" y="315" fill="#334155" font-size="12" font-weight="bold">Формат события / повод:</text>
  <rect x="45" y="325" width="340" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="58" y="348" fill="#0f172a" font-size="13">Торжественный семейный ужин</text>

  <text x="45" y="385" fill="#334155" font-size="12" font-weight="bold">Критерии отбора коллекции:</text>
  <rect x="45" y="400" width="18" height="18" rx="4" fill="#8b2252"/>
  <text x="50" y="414" fill="#ffffff" font-size="12" font-weight="bold">✓</text>
  <text x="72" y="414" fill="#1e293b" font-size="12">Только зрелые вина (на пике вкуса)</text>

  <rect x="45" y="428" width="18" height="18" rx="4" fill="#8b2252"/>
  <text x="50" y="442" fill="#ffffff" font-size="12" font-weight="bold">✓</text>
  <text x="72" y="442" fill="#1e293b" font-size="12">Исключить бутылки в стадии созревания</text>

  <rect x="45" y="456" width="18" height="18" rx="4" fill="#8b2252"/>
  <text x="50" y="470" fill="#ffffff" font-size="12" font-weight="bold">✓</text>
  <text x="72" y="470" fill="#1e293b" font-size="12">Только бутылки в наличии в погребе (>0)</text>

  <!-- Submit Button -->
  <rect x="45" y="520" width="340" height="42" rx="6" fill="#8b2252"/>
  <text x="215" y="546" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Подобрать винную пару</text>

  <!-- Right Column: Recommendations -->
  <rect x="425" y="105" width="550" height="485" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="425" y="105" width="550" height="45" rx="6 6 0 0" fill="#f8fafc"/>
  <text x="445" y="133" fill="#1e293b" font-size="15" font-weight="bold">Рекомендации сомелье из вашего погреба (Найдено 2 пары)</text>

  <!-- Match 1: 98% -->
  <rect x="445" y="165" width="510" height="180" rx="6" fill="#fdf2f8" stroke="#f472b6" stroke-width="1"/>
  <rect x="460" y="180" width="135" height="22" rx="11" fill="#8b2252"/>
  <text x="527" y="195" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">СОВПАДЕНИЕ 98%</text>

  <text x="605" y="196" fill="#831843" font-size="15" font-weight="bold">Каберне Совиньон Резерв 2018</text>
  <text x="460" y="225" fill="#475569" font-size="12">Локация в погребе: <tspan font-weight="bold" fill="#0f172a">Стеллаж 1 • Полка 2 (A-2-04)</tspan> | В наличии: <tspan font-weight="bold" fill="#16a34a">2 бутылки</tspan></text>
  
  <rect x="460" y="238" width="480" height="62" rx="4" fill="#ffffff" stroke="#fbcfe8" stroke-width="1"/>
  <text x="470" y="258" fill="#831843" font-size="11" font-weight="bold">ОБОСНОВАНИЕ ГАСТРОНОМИЧЕСКОЙ СОВМЕСТИМОСТИ:</text>
  <text x="470" y="276" fill="#334155" font-size="12">Высокий уровень танинов и 6-летняя выдержка вина идеально связывают белок и</text>
  <text x="470" y="292" fill="#334155" font-size="12">жиры говядины на гриле, раскрывая ноты черной смородины и выдержанного дуба.</text>

  <rect x="460" y="308" width="160" height="28" rx="4" fill="#16a34a"/>
  <text x="540" y="326" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Зарезервировать к ужину</text>

  <!-- Match 2: 91% -->
  <rect x="445" y="360" width="510" height="165" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="460" y="375" width="135" height="22" rx="11" fill="#475569"/>
  <text x="527" y="390" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">СОВПАДЕНИЕ 91%</text>

  <text x="605" y="391" fill="#1e293b" font-size="15" font-weight="bold">Саперави Кахетинское 2020</text>
  <text x="460" y="418" fill="#475569" font-size="12">Локация в погребе: <tspan font-weight="bold" fill="#0f172a">Стеллаж 2 • Полка 1 (B-1-03)</tspan> | В наличии: <tspan font-weight="bold" fill="#16a34a">3 бутылки</tspan></text>
  
  <rect x="460" y="430" width="480" height="52" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="470" y="450" fill="#475569" font-size="11" font-weight="bold">АЛЬТЕРНАТИВНАЯ ПАРА:</text>
  <text x="470" y="468" fill="#334155" font-size="12">Густой танинный профиль и выразительная кислотность подчеркивают мясной сок.</text>

  <rect x="460" y="490" width="160" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="540" y="507" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">Подробнее о вине</text>

  <!-- Bottom Window Statusbar -->
  <rect x="10" y="600" width="980" height="30" rx="0 0 10 10" fill="#e2e8f0"/>
  <text x="25" y="620" fill="#475569" font-size="11">Пейринг-движок: матрица органолептических соответствий (кислотность, танины, сладость vs соленость, жир, белок).</text>
</svg>