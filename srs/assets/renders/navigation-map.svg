<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">Карта переходов интерфейса «Сводки»</title>
  <desc id="d">Четыре узла — главный экран, экран лент, страница ошибки и внешний источник — и восемь переходов: четыре GET-перехода со стрелками и четыре POST-действия в отдельной панели.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1F2328"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#F7F7F5"/>

  <!-- Заголовок -->
  <text x="40" y="52" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2328">Карта переходов интерфейса</text>
  <text x="40" y="80" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" fill="#5B6570">SysML v2: package SvodkaUI::Navigation · 8 переходов · соответствует sysml/model/ui-navigation.sysml</text>

  <!-- Узлы -->
  <rect x="60" y="140" width="260" height="110" rx="12" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="80" y="176" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2328">Главный экран</text>
  <text x="80" y="202" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" fill="#1D4ED8">/</text>
  <text x="80" y="228" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#5B6570">статьи · фильтр · пагинация</text>

  <rect x="400" y="140" width="260" height="110" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="420" y="176" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2328">Экран лент</text>
  <text x="420" y="202" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" fill="#1D4ED8">/feeds</text>
  <text x="420" y="228" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#5B6570">таблица · форма · удаление</text>

  <rect x="60" y="420" width="260" height="110" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="80" y="456" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2328">Страница ошибки</text>
  <text x="80" y="482" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" fill="#B42318">404</text>
  <text x="80" y="508" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#5B6570">вход: неизвестный путь</text>

  <rect x="400" y="420" width="260" height="110" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="420" y="456" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2328">Внешний источник</text>
  <text x="420" y="482" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" fill="#1D4ED8">URL статьи</text>
  <text x="420" y="508" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#5B6570">новая вкладка</text>

  <!-- Переходы GET -->
  <line x1="320" y1="175" x2="400" y2="175" stroke="#1F2328" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="163" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#1F2328" text-anchor="middle">GET 200</text>

  <line x1="400" y1="205" x2="320" y2="205" stroke="#1F2328" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="227" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#1F2328" text-anchor="middle">GET 200</text>

  <line x1="190" y1="250" x2="190" y2="420" stroke="#1F2328" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="203" y="330" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#1F2328">GET 404</text>

  <line x1="150" y1="420" x2="150" y2="250" stroke="#1F2328" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="137" y="330" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#1F2328" text-anchor="end">GET 200</text>

  <line x1="320" y1="250" x2="400" y2="420" stroke="#1F2328" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="345" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#1F2328">GET 302</text>
  <text x="410" y="361" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#5B6570">/articles/{id}/go</text>

  <!-- Панель POST-действий -->
  <rect x="700" y="140" width="440" height="330" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="724" y="174" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">POST-действия</text>

  <text x="724" y="212" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328">Обновить</text>
  <text x="1116" y="212" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#1D4ED8" text-anchor="end">202 / 429</text>
  <text x="724" y="232" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#5B6570">кнопка в шапке → та же страница</text>

  <text x="724" y="278" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328">Добавить ленту</text>
  <text x="1116" y="278" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#1D4ED8" text-anchor="end">302 / 400 / 409</text>
  <text x="724" y="298" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#5B6570">/feeds → /feeds</text>

  <text x="724" y="344" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328">Удалить ленту</text>
  <text x="1116" y="344" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#1D4ED8" text-anchor="end">302 / 404</text>
  <text x="724" y="364" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#5B6570">/feeds → /feeds</text>

  <text x="724" y="410" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328">Отметить прочитанное</text>
  <text x="1116" y="410" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#1D4ED8" text-anchor="end">302</text>
  <text x="724" y="430" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#5B6570">/articles/{id}/read → та же страница</text>

  <!-- Легенда -->
  <line x1="60" y1="600" x2="110" y2="600" stroke="#1F2328" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="122" y="605" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" fill="#5B6570">GET-переход</text>
  <rect x="250" y="592" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="274" y="605" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" fill="#5B6570">экран приложения</text>

  <!-- Подпись -->
  <text x="40" y="720" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" fill="#5B6570">Макет интерфейса · Сводка 1.0 · REQ-INT-001 · sysml/mockups/navigation-map.svg</text>
</svg>
