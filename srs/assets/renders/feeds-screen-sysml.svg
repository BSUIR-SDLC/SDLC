skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle

comp def "FeedsScreen" as E1  <<(T,blue) part  def>> [[psysml:bfc0b481-2c49-4dd0-a612-689b86096b80 ]] {
