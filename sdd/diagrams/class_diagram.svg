<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="diamond" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 6 L 6 0 L 12 6 L 6 12 z" fill="#2d3748"/>
    </marker>
    <marker id="realize" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#f8fafc"/>

  <!-- Заголовок диаграммы -->
  <rect x="20" y="15" width="920" height="40" rx="6" fill="#2b121d"/>
  <text x="480" y="40" fill="#f5e6ec" font-size="16" font-weight="bold" text-anchor="middle">UML-диаграмма классов логической структуры приложения WineVault</text>

  <!-- Class: WineItem -->
  <g transform="translate(40, 80)" filter="url(#shadow)">
    <rect width="260" height="230" rx="4" fill="#ffffff" stroke="#721c47" stroke-width="2"/>
    <rect width="260" height="32" rx="4" fill="#721c47"/>
    <text x="130" y="21" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">WineItem</text>
    <text x="12" y="52" fill="#2d3748" font-size="11">- id: UUID</text>
    <text x="12" y="70" fill="#2d3748" font-size="11">- name: String</text>
    <text x="12" y="88" fill="#2d3748" font-size="11">- grapeVariety: String</text>
    <text x="12" y="106" fill="#2d3748" font-size="11">- vintageYear: int</text>
    <text x="12" y="124" fill="#2d3748" font-size="11">- type: WineType</text>
    <text x="12" y="142" fill="#2d3748" font-size="11">- sweetness: SweetnessLevel</text>
    <text x="12" y="160" fill="#2d3748" font-size="11">- location: CellarLocation</text>
    <text x="12" y="178" fill="#2d3748" font-size="11">- tastingNote: TastingNote</text>
    <line x1="0" y1="188" x2="260" y2="188" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="206" fill="#1e293b" font-size="11">+ isReadyToDrink(): boolean</text>
    <text x="12" y="222" fill="#1e293b" font-size="11">+ getVintage(): int</text>
  </g>

  <!-- Class: CellarLocation -->
  <g transform="translate(40, 360)" filter="url(#shadow)">
    <rect width="260" height="110" rx="4" fill="#ffffff" stroke="#721c47" stroke-width="1.5"/>
    <rect width="260" height="28" rx="4" fill="#8b2252"/>
    <text x="130" y="19" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">CellarLocation</text>
    <text x="12" y="48" fill="#2d3748" font-size="11">- sector: String</text>
    <text x="12" y="66" fill="#2d3748" font-size="11">- rack: int; shelf: int; cell: int</text>
    <line x1="0" y1="76" x2="260" y2="76" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="96" fill="#1e293b" font-size="11">+ toCoordinateString(): String</text>
  </g>

  <!-- Class: TastingNote -->
  <g transform="translate(40, 495)" filter="url(#shadow)">
    <rect width="260" height="105" rx="4" fill="#ffffff" stroke="#721c47" stroke-width="1.5"/>
    <rect width="260" height="28" rx="4" fill="#8b2252"/>
    <text x="130" y="19" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">TastingNote</text>
    <text x="12" y="48" fill="#2d3748" font-size="11">- tastingDate: LocalDate</text>
    <text x="12" y="66" fill="#2d3748" font-size="11">- parkerScore: int (1..100)</text>
    <text x="12" y="84" fill="#2d3748" font-size="11">- notes: String</text>
  </g>

  <!-- Association WineItem -> CellarLocation -->
  <line x1="170" y1="310" x2="170" y2="360" stroke="#2d3748" stroke-width="1.5" marker-start="url(#diamond)"/>
  <!-- Association WineItem -> TastingNote -->
  <line x1="80" y1="310" x2="80" y2="495" stroke="#2d3748" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Service: WineService -->
  <g transform="translate(360, 80)" filter="url(#shadow)">
    <rect width="260" height="230" rx="4" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
    <rect width="260" height="32" rx="4" fill="#2b6cb0"/>
    <text x="130" y="21" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">WineService</text>
    <text x="12" y="52" fill="#2d3748" font-size="11">- repository: WineRepository</text>
    <text x="12" y="70" fill="#2d3748" font-size="11">- calculator: AgingCalculator</text>
    <text x="12" y="88" fill="#2d3748" font-size="11">- sommelier: SommelierEngine</text>
    <line x1="0" y1="98" x2="260" y2="98" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="118" fill="#1e293b" font-size="11">+ getAllWines(): List&lt;WineItem&gt;</text>
    <text x="12" y="136" fill="#1e293b" font-size="11">+ addWine(WineItem item): void</text>
    <text x="12" y="154" fill="#1e293b" font-size="11">+ filterAtPeak(): List&lt;WineItem&gt;</text>
    <text x="12" y="172" fill="#1e293b" font-size="11">+ search(String q): List&lt;WineItem&gt;</text>
    <text x="12" y="190" fill="#1e293b" font-size="11">+ consume(UUID id, TastingNote n)</text>
    <text x="12" y="208" fill="#1e293b" font-size="11">+ exportToCsv(Path p): void</text>
  </g>

  <!-- Service: AgingCalculator -->
  <g transform="translate(360, 360)" filter="url(#shadow)">
    <rect width="260" height="110" rx="4" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
    <rect width="260" height="28" rx="4" fill="#3182ce"/>
    <text x="130" y="19" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">AgingCalculator</text>
    <text x="12" y="52" fill="#1e293b" font-size="11">+ calculatePeak(WineItem): LocalDate</text>
    <text x="12" y="72" fill="#1e293b" font-size="11">+ getProgress(WineItem): double</text>
    <text x="12" y="92" fill="#1e293b" font-size="11">+ getMaturityStatus(WineItem): Status</text>
  </g>

  <!-- Service: SommelierEngine -->
  <g transform="translate(360, 495)" filter="url(#shadow)">
    <rect width="260" height="105" rx="4" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
    <rect width="260" height="28" rx="4" fill="#3182ce"/>
    <text x="130" y="19" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">SommelierEngine</text>
    <text x="12" y="52" fill="#1e293b" font-size="11">+ recommend(DishCategory d):</text>
    <text x="24" y="70" fill="#1e293b" font-size="11">List&lt;PairingRecommendation&gt;</text>
    <text x="12" y="90" fill="#1e293b" font-size="11">+ calculateMatchScore(): int</text>
  </g>

  <!-- Interface: WineRepository -->
  <g transform="translate(680, 80)" filter="url(#shadow)">
    <rect width="240" height="160" rx="4" fill="#ffffff" stroke="#276749" stroke-width="2"/>
    <rect width="240" height="36" rx="4" fill="#276749"/>
    <text x="120" y="16" fill="#bbf7d0" font-size="10" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text x="120" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">WineRepository</text>
    <text x="12" y="60" fill="#1e293b" font-size="11">+ findAll(): List&lt;WineItem&gt;</text>
    <text x="12" y="80" fill="#1e293b" font-size="11">+ findById(UUID): Optional</text>
    <text x="12" y="100" fill="#1e293b" font-size="11">+ save(WineItem): void</text>
    <text x="12" y="120" fill="#1e293b" font-size="11">+ delete(UUID): void</text>
    <text x="12" y="140" fill="#1e293b" font-size="11">+ saveAll(List&lt;WineItem&gt;): void</text>
  </g>

  <!-- Implementation: JsonWineRepositoryImpl -->
  <g transform="translate(680, 310)" filter="url(#shadow)">
    <rect width="240" height="150" rx="4" fill="#ffffff" stroke="#276749" stroke-width="1.5"/>
    <rect width="240" height="28" rx="4" fill="#2f855a"/>
    <text x="120" y="19" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">JsonWineRepositoryImpl</text>
    <text x="12" y="50" fill="#2d3748" font-size="11">- storagePath: Path</text>
    <text x="12" y="68" fill="#2d3748" font-size="11">- mapper: ObjectMapper</text>
    <line x1="0" y1="78" x2="240" y2="78" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="98" fill="#1e293b" font-size="11">+ load(): List&lt;WineItem&gt;</text>
    <text x="12" y="118" fill="#1e293b" font-size="11">+ atomicWrite(List&lt;WineItem&gt;)</text>
    <text x="12" y="136" fill="#1e293b" font-size="11">+ backup(): void</text>
  </g>

  <!-- Realization link: JsonWineRepositoryImpl ..|> WineRepository -->
  <line x1="800" y1="310" x2="800" y2="240" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5" marker-end="url(#realize)"/>

  <!-- Dependency/Usage WineService -> WineRepository -->
  <line x1="620" y1="150" x2="680" y2="150" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Composition WineService -> AgingCalculator & SommelierEngine -->
  <line x1="490" y1="310" x2="490" y2="360" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="310" x2="430" y2="495" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dependency WineService -> WineItem -->
  <line x1="360" y1="180" x2="300" y2="180" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>