<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.10"/>
    </filter>
    
    <!-- Навигационная стрелка -->
    <marker id="nav-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"/>
    </marker>
    
    <!-- Композиция (залитый ромб) -->
    <marker id="comp-diamond" viewBox="0 0 14 14" refX="1" refY="7" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 7 L 7 2 L 13 7 L 7 12 z" fill="#721c47" stroke="#721c47" stroke-width="1.5"/>
    </marker>
    
    <!-- Агрегация (пустой ромб) -->
    <marker id="aggr-diamond" viewBox="0 0 14 14" refX="1" refY="7" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 7 L 7 2 L 13 7 L 7 12 z" fill="#ffffff" stroke="#721c47" stroke-width="1.5"/>
    </marker>
    
    <!-- Реализация интерфейса (пустой белый треугольник) -->
    <marker id="realize-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#ffffff" stroke="#166534" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Фон -->
  <rect width="1200" height="600" fill="#f8fafc"/>

  <!-- Верхняя плашка-заголовок -->
  <rect x="25" y="15" width="1150" height="40" rx="6" fill="#1e293b"/>
  <text x="600" y="41" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">UML-диаграмма классов логической структуры приложения WineVault</text>

  <!-- ==================== СЛОЙ МОДЕЛИ (Model Entities) ==================== -->
  
  <!-- 1. CellarLocation (слева вверху) -->
  <g transform="translate(25, 80)" filter="url(#shadow)">
    <rect width="210" height="150" rx="5" fill="#ffffff" stroke="#8b2252" stroke-width="1.5"/>
    <rect width="210" height="30" rx="5 5 0 0" fill="#8b2252"/>
    <text x="105" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">CellarLocation</text>
    
    <text x="12" y="50" fill="#334155" font-size="11">- sector: String</text>
    <text x="12" y="68" fill="#334155" font-size="11">- rack: int</text>
    <text x="12" y="86" fill="#334155" font-size="11">- shelf: int</text>
    <text x="12" y="104" fill="#334155" font-size="11">- cellNumber: int</text>
    <line x1="0" y1="114" x2="210" y2="114" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="133" fill="#0f172a" font-size="11">+ toCoordinateString(): String</text>
  </g>

  <!-- 2. WineItem (центр модели) -->
  <g transform="translate(275, 80)" filter="url(#shadow)">
    <rect width="255" height="245" rx="5" fill="#ffffff" stroke="#721c47" stroke-width="2"/>
    <rect width="255" height="32" rx="5 5 0 0" fill="#721c47"/>
    <text x="127" y="21" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">WineItem</text>
    
    <text x="12" y="52" fill="#334155" font-size="11">- id: UUID</text>
    <text x="12" y="70" fill="#334155" font-size="11">- name: String</text>
    <text x="12" y="88" fill="#334155" font-size="11">- grapeVariety: String</text>
    <text x="12" y="106" fill="#334155" font-size="11">- vintageYear: int</text>
    <text x="12" y="124" fill="#334155" font-size="11">- type: WineType</text>
    <text x="12" y="142" fill="#334155" font-size="11">- sweetness: SweetnessLevel</text>
    <text x="12" y="160" fill="#334155" font-size="11">- location: CellarLocation</text>
    <text x="12" y="178" fill="#334155" font-size="11">- tastingNote: TastingNote</text>
    <line x1="0" y1="190" x2="255" y2="190" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="210" fill="#0f172a" font-size="11">+ isReadyToDrink(): boolean</text>
    <text x="12" y="228" fill="#0f172a" font-size="11">+ getVintage(): int</text>
  </g>

  <!-- 3. TastingNote (под WineItem) -->
  <g transform="translate(275, 385)" filter="url(#shadow)">
    <rect width="255" height="150" rx="5" fill="#ffffff" stroke="#8b2252" stroke-width="1.5"/>
    <rect width="255" height="30" rx="5 5 0 0" fill="#8b2252"/>
    <text x="127" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">TastingNote</text>
    
    <text x="12" y="50" fill="#334155" font-size="11">- tastingDate: LocalDate</text>
    <text x="12" y="70" fill="#334155" font-size="11">- parkerScore: int (1..100)</text>
    <text x="12" y="90" fill="#334155" font-size="11">- aromaNotes: String</text>
    <text x="12" y="110" fill="#334155" font-size="11">- tasteProfile: String</text>
    <line x1="0" y1="120" x2="255" y2="120" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="138" fill="#0f172a" font-size="11">+ getFormattedRating(): String</text>
  </g>

  <!-- ==================== СЛОЙ СЕРВИСОВ (Service Layer) ==================== -->

  <!-- 4. WineService (фасад бизнес-логики) -->
  <g transform="translate(570, 80)" filter="url(#shadow)">
    <rect width="340" height="245" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <rect width="340" height="32" rx="5 5 0 0" fill="#1d4ed8"/>
    <text x="170" y="21" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">WineService</text>
    
    <text x="12" y="52" fill="#334155" font-size="11">- repository: WineRepository</text>
    <text x="12" y="70" fill="#334155" font-size="11">- calculator: AgingCalculator</text>
    <text x="12" y="88" fill="#334155" font-size="11">- sommelier: SommelierEngine</text>
    <line x1="0" y1="98" x2="340" y2="98" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="118" fill="#0f172a" font-size="11">+ getAllWines(): List&lt;WineItem&gt;</text>
    <text x="12" y="138" fill="#0f172a" font-size="11">+ addWine(WineItem item): void</text>
    <text x="12" y="158" fill="#0f172a" font-size="11">+ filterAtPeak(): List&lt;WineItem&gt;</text>
    <text x="12" y="178" fill="#0f172a" font-size="11">+ search(String query): List&lt;WineItem&gt;</text>
    <text x="12" y="198" fill="#0f172a" font-size="11">+ consume(UUID id, TastingNote note): void</text>
    <text x="12" y="218" fill="#0f172a" font-size="11">+ exportToCsv(Path targetPath): void</text>
  </g>

  <!-- 5. AgingCalculator (под WineService, левая колонка) -->
  <g transform="translate(570, 385)" filter="url(#shadow)">
    <rect width="160" height="150" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="160" height="30" rx="5 5 0 0" fill="#2563eb"/>
    <text x="80" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">AgingCalculator</text>
    
    <text x="10" y="54" fill="#0f172a" font-size="10">+ calculatePeak(</text>
    <text x="18" y="68" fill="#0f172a" font-size="10">WineItem): LocalDate</text>
    <text x="10" y="90" fill="#0f172a" font-size="10">+ getProgress(</text>
    <text x="18" y="104" fill="#0f172a" font-size="10">WineItem): double</text>
    <text x="10" y="126" fill="#0f172a" font-size="10">+ evaluateStatus(</text>
    <text x="18" y="140" fill="#0f172a" font-size="10">WineItem): Status</text>
  </g>

  <!-- 6. SommelierEngine (под WineService, правая колонка) -->
  <g transform="translate(750, 385)" filter="url(#shadow)">
    <rect width="160" height="150" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="160" height="30" rx="5 5 0 0" fill="#2563eb"/>
    <text x="80" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">SommelierEngine</text>
    
    <text x="10" y="54" fill="#0f172a" font-size="10">+ findPairings(</text>
    <text x="18" y="68" fill="#0f172a" font-size="10">DishCategory): List</text>
    <text x="10" y="94" fill="#0f172a" font-size="10">+ calculateMatch(</text>
    <text x="18" y="108" fill="#0f172a" font-size="10">Wine, Dish): int</text>
    <text x="10" y="134" fill="#0f172a" font-size="10">+ getFlavorMap(): Map</text>
  </g>

  <!-- ==================== СЛОЙ ХРАНИЛИЩА (Repository) ==================== -->

  <!-- 7. WineRepository (интерфейс справа вверху) -->
  <g transform="translate(950, 80)" filter="url(#shadow)">
    <rect width="225" height="165" rx="5" fill="#ffffff" stroke="#166534" stroke-width="2"/>
    <rect width="225" height="36" rx="5 5 0 0" fill="#166534"/>
    <text x="112" y="16" fill="#bbf7d0" font-size="10" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text x="112" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">WineRepository</text>
    
    <text x="12" y="58" fill="#0f172a" font-size="11">+ findAll(): List&lt;WineItem&gt;</text>
    <text x="12" y="78" fill="#0f172a" font-size="11">+ findById(UUID): Optional</text>
    <text x="12" y="98" fill="#0f172a" font-size="11">+ save(WineItem): void</text>
    <text x="12" y="118" fill="#0f172a" font-size="11">+ delete(UUID): void</text>
    <text x="12" y="138" fill="#0f172a" font-size="11">+ saveAll(List&lt;WineItem&gt;): void</text>
  </g>

  <!-- 8. JsonWineRepositoryImpl (под WineRepository) -->
  <g transform="translate(950, 385)" filter="url(#shadow)">
    <rect width="225" height="150" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <rect width="225" height="30" rx="5 5 0 0" fill="#15803d"/>
    <text x="112" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">JsonWineRepositoryImpl</text>
    
    <text x="12" y="50" fill="#334155" font-size="11">- storagePath: Path</text>
    <text x="12" y="70" fill="#334155" font-size="11">- mapper: ObjectMapper</text>
    <line x1="0" y1="80" x2="225" y2="80" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="100" fill="#0f172a" font-size="11">+ load(): List&lt;WineItem&gt;</text>
    <text x="12" y="120" fill="#0f172a" font-size="11">+ atomicWrite(List): void</text>
    <text x="12" y="140" fill="#0f172a" font-size="11">+ createBackup(): void</text>
  </g>

  <!-- ==================== СВЯЗИ И ЛИНИИ (100% ПРЯМЫЕ, БЕЗ ПЕРЕСЕЧЕНИЙ) ==================== -->

  <!-- 1. Композиция: WineItem *-\- CellarLocation (горизонтальная прямая) -->
  <!-- Из левой грани WineItem (x=275, y=155) в правую грань CellarLocation (x=235, y=155) -->
  <line x1="275" y1="155" x2="235" y2="155" stroke="#721c47" stroke-width="1.8" marker-start="url(#comp-diamond)"/>

  <!-- 2. Агрегация: WineItem o-\- TastingNote (вертикальная прямая) -->
  <!-- Из нижней грани WineItem (x=402, y=325) в верхнюю грань TastingNote (x=402, y=385) -->
  <line x1="402" y1="325" x2="402" y2="385" stroke="#721c47" stroke-width="1.8" marker-start="url(#aggr-diamond)"/>

  <!-- 3. Зависимость/Использование: WineService -\-> WineItem (горизонтальная прямая) -->
  <!-- Из левой грани WineService (x=570, y=180) в правую грань WineItem (x=530, y=180) -->
  <line x1="570" y1="180" x2="530" y2="180" stroke="#334155" stroke-width="1.8" marker-end="url(#nav-arrow)"/>

  <!-- 4. Ассоциация: WineService -\-> WineRepository (горизонтальная прямая) -->
  <!-- Из правой грани WineService (x=910, y=160) в левую грань WineRepository (x=950, y=160) -->
  <line x1="910" y1="160" x2="950" y2="160" stroke="#334155" stroke-width="1.8" marker-end="url(#nav-arrow)"/>

  <!-- 5. Ассоциация: WineService -\-> AgingCalculator (вертикальная прямая) -->
  <!-- Из нижней грани WineService (x=650, y=325) в верхнюю грань AgingCalculator (x=650, y=385) -->
  <line x1="650" y1="325" x2="650" y2="385" stroke="#334155" stroke-width="1.8" marker-end="url(#nav-arrow)"/>

  <!-- 6. Ассоциация: WineService -\-> SommelierEngine (вертикальная прямая) -->
  <!-- Из нижней грани WineService (x=830, y=325) в верхнюю грань SommelierEngine (x=830, y=385) -->
  <line x1="830" y1="325" x2="830" y2="385" stroke="#334155" stroke-width="1.8" marker-end="url(#nav-arrow)"/>

  <!-- 7. Реализация: JsonWineRepositoryImpl ..|> WineRepository (вертикальная пунктирная прямая) -->
  <!-- Из верхней грани JsonWineRepositoryImpl (x=1062, y=385) вверх в нижнюю грань WineRepository (x=1062, y=245) -->
  <line x1="1062" y1="385" x2="1062" y2="245" stroke="#166534" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#realize-arrow)"/>

  <!-- Легенда связей внизу -->
  <g transform="translate(25, 560)">
    <!-- Композиция -->
    <path d="M 0 10 L 6 6 L 12 10 L 6 14 z" fill="#721c47"/>
    <line x1="12" y1="10" x2="30" y2="10" stroke="#721c47" stroke-width="1.5"/>
    <text x="36" y="14" fill="#475569" font-size="11">Композиция (1..1)</text>

    <!-- Агрегация -->
    <path d="M 160 10 L 166 6 L 172 10 L 166 14 z" fill="#ffffff" stroke="#721c47" stroke-width="1.2"/>
    <line x1="172" y1="10" x2="190" y2="10" stroke="#721c47" stroke-width="1.5"/>
    <text x="196" y="14" fill="#475569" font-size="11">Агрегация (0..1)</text>

    <!-- Ассоциация -->
    <line x1="320" y1="10" x2="350" y2="10" stroke="#334155" stroke-width="1.5" marker-end="url(#nav-arrow)"/>
    <text x="358" y="14" fill="#475569" font-size="11">Ассоциация / Вызов методов</text>

    <!-- Реализация -->
    <line x1="560" y1="10" x2="590" y2="10" stroke="#166534" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#realize-arrow)"/>
    <text x="598" y="14" fill="#475569" font-size="11">Реализация интерфейса (implements)</text>
  </g>
</svg>