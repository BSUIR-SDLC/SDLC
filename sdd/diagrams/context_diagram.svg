<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="800" height="680" fill="#ffffff"/>
  <rect x="20" y="15" width="760" height="40" rx="6" fill="#1e293b"/>
  <text x="400" y="40" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">Контекст системы «WineVault» (SDD 3.x, точка зрения «Контекст»)</text>

  <!-- Акторы -->
  <!-- Владелец погреба -->
  <g transform="translate(180, 85)">
    <circle cx="30" cy="20" r="16" fill="none" stroke="#1e293b" stroke-width="2"/>
    <line x1="30" y1="36" x2="30" y2="75" stroke="#1e293b" stroke-width="2"/>
    <line x1="10" y1="50" x2="50" y2="50" stroke="#1e293b" stroke-width="2"/>
    <line x1="30" y1="75" x2="10" y2="105" stroke="#1e293b" stroke-width="2"/>
    <line x1="30" y1="75" x2="50" y2="105" stroke="#1e293b" stroke-width="2"/>
    <text x="30" y="125" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Владелец погреба</text>
  </g>

  <!-- Гость / Сомелье -->
  <g transform="translate(560, 85)">
    <circle cx="30" cy="20" r="16" fill="none" stroke="#1e293b" stroke-width="2"/>
    <line x1="30" y1="36" x2="30" y2="75" stroke="#1e293b" stroke-width="2"/>
    <line x1="10" y1="50" x2="50" y2="50" stroke="#1e293b" stroke-width="2"/>
    <line x1="30" y1="75" x2="10" y2="105" stroke="#1e293b" stroke-width="2"/>
    <line x1="30" y1="75" x2="50" y2="105" stroke="#1e293b" stroke-width="2"/>
    <text x="30" y="125" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Гость / Сомелье</text>
  </g>

  <!-- Система WineVault -->
  <rect x="240" y="270" width="320" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="305" fill="#78350f" font-size="16" font-weight="bold" text-anchor="middle">WineVault</text>
  <text x="400" y="330" fill="#92400e" font-size="13" text-anchor="middle">(Desktop JavaFX-приложение)</text>

  <!-- Стрелки от акторов -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
    <marker id="dasharrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <path d="M 210 200 L 210 315 L 240 315" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="140" y="240" fill="#334155" font-size="11" text-anchor="middle">учет бутылок,</text>
  <text x="140" y="255" fill="#334155" font-size="11" text-anchor="middle">координаты полок,</text>
  <text x="140" y="270" fill="#334155" font-size="11" text-anchor="middle">списание запасов</text>

  <path d="M 590 200 L 590 315 L 560 315" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="660" y="245" fill="#334155" font-size="11" text-anchor="middle">подбор вин к блюдам,</text>
  <text x="660" y="260" fill="#334155" font-size="11" text-anchor="middle">оценка готовности,</text>
  <text x="660" y="275" fill="#334155" font-size="11" text-anchor="middle">дегустационные заметки</text>

  <!-- Локальная файловая система (Air-gap) -->
  <rect x="250" y="440" width="300" height="85" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="470" fill="#1e3a8a" font-size="14" font-weight="bold" text-anchor="middle">Локальная ФС (Air-gap)</text>
  <text x="400" y="492" fill="#1e40af" font-size="12" text-anchor="middle">wine_cellar.json (JSON-реестр)</text>
  <text x="400" y="510" fill="#64748b" font-size="11" text-anchor="middle">Двухфазная атомарная запись .tmp</text>

  <line x1="400" y1="360" x2="400" y2="440" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="405" fill="#1e40af" font-size="11" text-anchor="middle">атомарный I/O</text>

  <!-- Экспорт меню / CSV -->
  <rect x="50" y="440" width="160" height="70" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="130" y="468" fill="#1e293b" font-size="12" font-weight="bold" text-anchor="middle">Печать / Таблицы</text>
  <text x="130" y="490" fill="#475569" font-size="11" text-anchor="middle">wine_card.csv (UTF-8)</text>

  <path d="M 280 360 L 280 475 L 210 475" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="430" fill="#64748b" font-size="11" text-anchor="middle">экспорт</text>

  <!-- Внешний сервис Vivino (Отложен на v1.1) -->
  <g transform="translate(600, 440)">
    <path d="M 0 20 Q 20 0 50 10 Q 80 0 100 20 Q 120 40 100 60 Q 80 80 50 70 Q 20 80 0 60 Q -20 40 0 20 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="50" y="38" fill="#64748b" font-size="11" font-weight="bold" text-anchor="middle">Vivino API</text>
    <text x="50" y="52" fill="#94a3b8" font-size="10" text-anchor="middle">(версия 1.1)</text>
  </g>
  <line x1="520" y1="360" x2="630" y2="445" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#dasharrow)"/>
  <text x="600" y="395" fill="#94a3b8" font-size="10">интеграция 1.1</text>
</svg>