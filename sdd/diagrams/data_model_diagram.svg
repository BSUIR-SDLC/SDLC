<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 750" width="880" height="750" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="880" height="750" fill="#ffffff"/>
  <rect x="20" y="15" width="840" height="40" rx="6" fill="#1e293b"/>
  <text x="440" y="40" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">Модель данных «WineVault» (SDD, точка зрения «Информация»)</text>

  <!-- wine_item (центральная сущность) -->
  <g transform="translate(310, 80)">
    <rect width="260" height="260" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect width="260" height="30" rx="6" fill="#0284c7"/>
    <text x="130" y="21" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">wine_item</text>
    <text x="15" y="52" fill="#0f172a" font-size="11">● id : uuid «PK»</text>
    <text x="15" y="72" fill="#334155" font-size="11">name : varchar</text>
    <text x="15" y="92" fill="#334155" font-size="11">grape_variety : varchar</text>
    <text x="15" y="112" fill="#334155" font-size="11">vintage_year : int</text>
    <text x="15" y="132" fill="#334155" font-size="11">wine_type : RED | WHITE | SPARKLING</text>
    <text x="15" y="152" fill="#334155" font-size="11">sweetness : DRY | SEMI_DRY | SWEET</text>
    <text x="15" y="172" fill="#334155" font-size="11">alcohol_pct : numeric(4,1)</text>
    <text x="15" y="192" fill="#334155" font-size="11">volume_ml : int (750)</text>
    <text x="15" y="212" fill="#334155" font-size="11">quantity : int</text>
    <text x="15" y="232" fill="#334155" font-size="11">status : AGING | AT_PEAK | OVERDUE</text>
    <text x="15" y="250" fill="#0369a1" font-size="10">purchase_date : date</text>
  </g>

  <!-- cellar_location -->
  <g transform="translate(20, 140)">
    <rect width="220" height="150" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect width="220" height="30" rx="6" fill="#16a34a"/>
    <text x="110" y="21" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">cellar_location</text>
    <text x="15" y="52" fill="#0f172a" font-size="11">● id : uuid «PK»</text>
    <text x="15" y="72" fill="#047857" font-size="11">wine_id : uuid «FK, UQ»</text>
    <text x="15" y="92" fill="#334155" font-size="11">sector : varchar (A..D)</text>
    <text x="15" y="112" fill="#334155" font-size="11">rack_number : int (1..10)</text>
    <text x="15" y="132" fill="#334155" font-size="11">shelf_number : int (1..8)</text>
    <text x="15" y="145" fill="#334155" font-size="11">cell_number : int (1..20)</text>
  </g>

  <!-- tasting_note -->
  <g transform="translate(640, 140)">
    <rect width="220" height="160" rx="6" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <rect width="220" height="30" rx="6" fill="#9333ea"/>
    <text x="110" y="21" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">tasting_note</text>
    <text x="15" y="52" fill="#0f172a" font-size="11">● id : uuid «PK»</text>
    <text x="15" y="72" fill="#7e22ce" font-size="11">wine_id : uuid «FK»</text>
    <text x="15" y="92" fill="#334155" font-size="11">tasting_date : date</text>
    <text x="15" y="112" fill="#334155" font-size="11">parker_score : int (1..100)</text>
    <text x="15" y="132" fill="#334155" font-size="11">aroma_notes : varchar</text>
    <text x="15" y="152" fill="#334155" font-size="11">taste_profile : varchar</text>
  </g>

  <!-- aging_profile (справочник плато созревания) -->
  <g transform="translate(100, 440)">
    <rect width="280" height="170" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect width="280" height="30" rx="6" fill="#d97706"/>
    <text x="140" y="21" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">aging_profile (правила выдержки)</text>
    <text x="15" y="52" fill="#0f172a" font-size="11">● grape_variety : varchar «PK»</text>
    <text x="15" y="75" fill="#334155" font-size="11">standard_aging_months : int</text>
    <text x="15" y="98" fill="#334155" font-size="11">plateau_duration_months : int</text>
    <text x="15" y="121" fill="#334155" font-size="11">acidity_index : numeric(3,1)</text>
    <text x="15" y="144" fill="#334155" font-size="11">tannin_level : LOW | MED | HIGH</text>
    <text x="15" y="163" fill="#334155" font-size="11">peak_window_years : int</text>
  </g>

  <!-- dish_pairing (матрица сомелье) -->
  <g transform="translate(500, 440)">
    <rect width="280" height="170" rx="6" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
    <rect width="280" height="30" rx="6" fill="#e11d48"/>
    <text x="140" y="21" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">dish_pairing (матрица сомелье)</text>
    <text x="15" y="52" fill="#0f172a" font-size="11">● dish_category : varchar «PK»</text>
    <text x="15" y="75" fill="#334155" font-size="11">recommended_wine_type : varchar</text>
    <text x="15" y="98" fill="#334155" font-size="11">recommended_varieties : varchar[]</text>
    <text x="15" y="121" fill="#334155" font-size="11">min_vintage_years : int</text>
    <text x="15" y="144" fill="#334155" font-size="11">compatibility_score : int (1..100)</text>
    <text x="15" y="163" fill="#334155" font-size="11">pairing_notes : varchar</text>
  </g>

  <!-- Связи ER -->
  <!-- cellar_location 1 - 1 wine_item -->
  <line x1="240" y1="210" x2="310" y2="210" stroke="#0f172a" stroke-width="2"/>
  <circle cx="245" cy="210" r="3" fill="#ffffff" stroke="#0f172a"/>
  <text x="275" y="200" fill="#0f172a" font-size="11" text-anchor="middle">1 : 1</text>

  <!-- wine_item 1 - N tasting_note -->
  <line x1="570" y1="210" x2="640" y2="210" stroke="#0f172a" stroke-width="2"/>
  <text x="605" y="200" fill="#0f172a" font-size="11" text-anchor="middle">1 : N</text>

  <!-- wine_item N - 1 aging_profile -->
  <path d="M 400 340 L 400 390 L 240 390 L 240 440" fill="none" stroke="#0f172a" stroke-width="1.8"/>
  <text x="270" y="415" fill="#0f172a" font-size="11">N : 1 (по сорту)</text>

  <!-- wine_item N - N dish_pairing -->
  <path d="M 480 340 L 480 390 L 640 390 L 640 440" fill="none" stroke="#0f172a" stroke-width="1.8"/>
  <text x="590" y="415" fill="#0f172a" font-size="11">N : M (пейринг)</text>
</svg>