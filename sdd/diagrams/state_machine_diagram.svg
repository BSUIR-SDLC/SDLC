<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="840" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="840" height="540" fill="#ffffff"/>
  <rect x="20" y="15" width="800" height="40" rx="6" fill="#1e293b"/>
  <text x="420" y="40" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">Состояния жизненного цикла винной бутылки в WineVault</text>

  <!-- Начальное состояние -->
  <circle cx="70" cy="180" r="14" fill="#0f172a"/>

  <!-- Состояние PURCHASED -->
  <g transform="translate(140, 150)">
    <rect width="140" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="70" y="35" fill="#1e293b" font-size="13" font-weight="bold" text-anchor="middle">PURCHASED</text>
    <text x="70" y="50" fill="#64748b" font-size="10" text-anchor="middle">внесена в каталог</text>
  </g>

  <!-- Стрелка начало -> PURCHASED -->
  <line x1="84" y1="180" x2="140" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Состояние AGING -->
  <g transform="translate(360, 150)">
    <rect width="150" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="75" y="35" fill="#1e40af" font-size="13" font-weight="bold" text-anchor="middle">AGING</text>
    <text x="75" y="50" fill="#3b82f6" font-size="10" text-anchor="middle">созревает (P &lt; 85%)</text>
  </g>

  <!-- Стрелка PURCHASED -> AGING -->
  <line x1="280" y1="180" x2="360" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="172" fill="#0f172a" font-size="10" text-anchor="middle">размещение в ячейку</text>

  <!-- Состояние AT_PEAK -->
  <g transform="translate(600, 150)">
    <rect width="160" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="80" y="35" fill="#166534" font-size="13" font-weight="bold" text-anchor="middle">AT_PEAK</text>
    <text x="80" y="50" fill="#15803d" font-size="10" text-anchor="middle">на пике (85% ≤ P ≤ 115%)</text>
  </g>

  <!-- Стрелка AGING -> AT_PEAK -->
  <line x1="510" y1="180" x2="600" y2="180" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="555" y="172" fill="#16a34a" font-size="10" text-anchor="middle">наступление Tpeak</text>

  <!-- Состояние OVERDUE -->
  <g transform="translate(600, 320)">
    <rect width="160" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="80" y="35" fill="#991b1b" font-size="13" font-weight="bold" text-anchor="middle">OVERDUE</text>
    <text x="80" y="50" fill="#b91c1c" font-size="10" text-anchor="middle">спад формы (P &gt; 115%)</text>
  </g>

  <!-- Стрелка AT_PEAK -> OVERDUE -->
  <line x1="680" y1="210" x2="680" y2="320" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="735" y="270" fill="#dc2626" font-size="10">прошло плато</text>

  <!-- Состояние CONSUMED (финальное) -->
  <g transform="translate(250, 420)">
    <rect width="200" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="100" y="35" fill="#5b21b6" font-size="13" font-weight="bold" text-anchor="middle">CONSUMED</text>
    <text x="100" y="50" fill="#6d28d9" font-size="10" text-anchor="middle">выпита, списана в архив</text>
  </g>

  <!-- Стрелки в CONSUMED из разных состояний -->
  <path d="M 680 380 L 680 450 L 450 450" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="570" y="442" fill="#7c3aed" font-size="10">списание / дегустация</text>

  <path d="M 600 190 L 350 190 L 350 420" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="360" y="270" fill="#7c3aed" font-size="10">дегустация на пике</text>

  <!-- Финальная точка -->
  <circle cx="150" cy="450" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="150" cy="450" r="8" fill="#0f172a"/>
  <line x1="250" y1="450" x2="164" y2="450" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
</svg>