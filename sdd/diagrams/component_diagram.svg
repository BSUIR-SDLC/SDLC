<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.10"/>
    </filter>
    <marker id="carrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#f8fafc"/>

  <!-- Заголовок -->
  <rect x="20" y="15" width="920" height="40" rx="6" fill="#1e293b"/>
  <text x="480" y="40" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">Компонентная архитектура модулей и пакетов WineVault</text>

  <!-- Слой UI (Presentation) -->
  <g transform="translate(40, 80)" filter="url(#shadow)">
    <rect width="260" height="340" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect width="260" height="34" rx="6" fill="#0284c7"/>
    <text x="130" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Пакет ui (JavaFX Presentation)</text>
    <rect x="20" y="55" width="220" height="48" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="130" y="84" fill="#0369a1" font-size="12" font-weight="600" text-anchor="middle">MainController &amp; Stage</text>
    <rect x="20" y="120" width="220" height="48" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="130" y="149" fill="#0369a1" font-size="12" font-weight="600" text-anchor="middle">CatalogViewController</text>
    <rect x="20" y="185" width="220" height="48" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="130" y="214" fill="#0369a1" font-size="12" font-weight="600" text-anchor="middle">TimelineViewController</text>
    <rect x="20" y="250" width="220" height="48" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="130" y="279" fill="#0369a1" font-size="12" font-weight="600" text-anchor="middle">SommelierViewController</text>
  </g>

  <!-- Слой Service (Business Logic) -->
  <g transform="translate(350, 80)" filter="url(#shadow)">
    <rect width="260" height="340" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="260" height="34" rx="6" fill="#2563eb"/>
    <text x="130" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Пакет service (Business Logic)</text>
    <rect x="20" y="55" width="220" height="48" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="130" y="84" fill="#1d4ed8" font-size="12" font-weight="600" text-anchor="middle">WineService</text>
    <rect x="20" y="120" width="220" height="48" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="130" y="149" fill="#1d4ed8" font-size="12" font-weight="600" text-anchor="middle">AgingCalculator</text>
    <rect x="20" y="185" width="220" height="48" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="130" y="214" fill="#1d4ed8" font-size="12" font-weight="600" text-anchor="middle">SommelierEngine</text>
    <rect x="20" y="250" width="220" height="48" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="130" y="279" fill="#1d4ed8" font-size="12" font-weight="600" text-anchor="middle">CsvExportService</text>
  </g>

  <!-- Слой Repository & Data (Storage) -->
  <g transform="translate(660, 80)" filter="url(#shadow)">
    <rect width="260" height="340" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect width="260" height="34" rx="6" fill="#16a34a"/>
    <text x="130" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Пакет repository (Storage I/O)</text>
    <rect x="20" y="55" width="220" height="48" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="130" y="84" fill="#15803d" font-size="12" font-weight="600" text-anchor="middle">&lt;&lt;interface&gt;&gt; WineRepository</text>
    <rect x="20" y="120" width="220" height="48" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="130" y="149" fill="#15803d" font-size="12" font-weight="600" text-anchor="middle">JsonWineRepositoryImpl</text>
    <rect x="20" y="195" width="220" height="95" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="130" y="222" fill="#991b1b" font-size="12" font-weight="600" text-anchor="middle">Локальная ФС (Air-gap)</text>
    <text x="130" y="244" fill="#475569" font-size="11" text-anchor="middle">wine_cellar.json</text>
    <text x="130" y="264" fill="#475569" font-size="11" text-anchor="middle">wine_cellar_backup.json</text>
    <text x="130" y="280" fill="#16a34a" font-size="10" text-anchor="middle">(Atomic Move Strategy)</text>
  </g>

  <!-- Стрелки между слоями -->
  <line x1="300" y1="160" x2="350" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#carrow)"/>
  <text x="325" y="150" fill="#64748b" font-size="10" text-anchor="middle">вызовы</text>

  <line x1="610" y1="160" x2="660" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#carrow)"/>
  <text x="635" y="150" fill="#64748b" font-size="10" text-anchor="middle">инверсия</text>
</svg>