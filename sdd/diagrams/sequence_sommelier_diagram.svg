<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="880" height="600" fill="#ffffff"/>
  <rect x="20" y="15" width="840" height="40" rx="6" fill="#1e293b"/>
  <text x="440" y="40" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">Гастрономический подбор вина виртуальным сомелье (SYS-09)</text>

  <!-- Участники -->
  <!-- 1. Сомелье / Гость -->
  <g transform="translate(60, 75)">
    <circle cx="25" cy="15" r="12" fill="none" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="25" y1="27" x2="25" y2="50" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="12" y1="36" x2="38" y2="36" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="25" y1="50" x2="12" y2="70" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="25" y1="50" x2="38" y2="70" stroke="#1e293b" stroke-width="1.8"/>
    <text x="25" y="88" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">Гость / Сомелье</text>
  </g>
  <line x1="85" y1="170" x2="85" y2="570" stroke="#94a3b8" stroke-dasharray="4,4"/>

  <!-- 2. SommelierController -->
  <rect x="180" y="85" width="140" height="36" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="250" y="108" fill="#0369a1" font-size="11" font-weight="bold" text-anchor="middle">SommelierController</text>
  <line x1="250" y1="121" x2="250" y2="570" stroke="#94a3b8" stroke-dasharray="4,4"/>

  <!-- 3. SommelierEngine -->
  <rect x="370" y="85" width="130" height="36" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="435" y="108" fill="#9d174d" font-size="11" font-weight="bold" text-anchor="middle">SommelierEngine</text>
  <line x1="435" y1="121" x2="435" y2="570" stroke="#94a3b8" stroke-dasharray="4,4"/>

  <!-- 4. WineRepository -->
  <rect x="560" y="85" width="120" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="620" y="108" fill="#15803d" font-size="11" font-weight="bold" text-anchor="middle">WineRepository</text>
  <line x1="620" y1="121" x2="620" y2="570" stroke="#94a3b8" stroke-dasharray="4,4"/>

  <!-- Сообщения -->
  <line x1="85" y1="160" x2="250" y2="160" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="167" y="152" fill="#0f172a" font-size="11" text-anchor="middle">selectDish("Стейк рибай")</text>

  <line x1="250" y1="195" x2="435" y2="195" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="342" y="187" fill="#0f172a" font-size="11" text-anchor="middle">findPairings(RED_MEAT)</text>

  <line x1="435" y1="235" x2="620" y2="235" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="527" y="227" fill="#0f172a" font-size="11" text-anchor="middle">findAllAvailable()</text>

  <line x1="620" y1="275" x2="435" y2="275" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="527" y="267" fill="#15803d" font-size="11" text-anchor="middle">List&lt;WineItem&gt; (в наличии)</text>

  <!-- Self-call: Расчет скоринга -->
  <path d="M 435 305 L 475 305 L 475 350 L 435 350" fill="none" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="485" y="320" fill="#db2777" font-size="10">1. фильтр по танинам &gt;= 7/10</text>
  <text x="485" y="335" fill="#db2777" font-size="10">2. расчет matchScore (0..100)</text>
  <text x="485" y="350" fill="#db2777" font-size="10">3. сортировка по убыванию скора</text>

  <line x1="435" y1="390" x2="250" y2="390" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="342" y="382" fill="#db2777" font-size="11" text-anchor="middle">List&lt;PairingRecommendation&gt;</text>

  <line x1="250" y1="435" x2="85" y2="435" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="167" y="427" fill="#0f172a" font-size="11" text-anchor="middle">Отображение карточек вин с указанием полки</text>

  <rect x="100" y="465" width="220" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="110" y="485" fill="#0f172a" font-size="10" font-weight="bold">1. Chateau Margaux 2015 (98%)</text>
  <text x="110" y="500" fill="#475569" font-size="10">Полка: Сектор A, Стеллаж 2, Ячейка 5</text>
  <text x="110" y="515" fill="#16a34a" font-size="10">Статус: AT_PEAK (Идеально к мясу)</text>
</svg>