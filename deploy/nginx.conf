server {
  listen 80;
  server_name _;

  client_max_body_size 1m;

  location /hooks/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    client_max_body_size 5m;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /health {
    proxy_pass http://api:3000/health;
  }
}
