name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests (qr-token, auth policy, scanner state machine)
        run: npm test
      - name: Coverage
        run: npm run test:coverage
