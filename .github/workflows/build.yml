# Сборка и тесты для каждого pull request и push в main (задача T-00.3, REQ-CM-001, REQ-BUILD-001).
name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Сборка и модульные тесты
        run: mvn -B verify
      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: project/target/surefire-reports
          if-no-files-found: ignore
